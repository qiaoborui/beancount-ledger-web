[project]
name = "beancount-ledger-agent"
version = "0.1.0"
description = "Bub-based agent runtime for Beancount Ledger Web"
requires-python = ">=3.12,<4.0"
dependencies = [
  "bub==0.4.1",
  "bub-tapestore-sqlalchemy @ git+https://github.com/bubbuild/bub-contrib.git@34715077877041b21472dcca39d91529296a1a9e#subdirectory=packages/bub-tapestore-sqlalchemy",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "psycopg[binary]>=3.2.9,<4",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
]

[project.scripts]
ledger-agent = "ledger_agent_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_agent_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
