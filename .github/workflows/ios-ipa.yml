name: iOS SideStore IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'App/LedgerMobile/**'
      - 'scripts/build-ios-ipa.sh'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build SideStore IPA
    # GitHub's newest Xcode preview image; macos-latest tracks stable macOS.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select latest installed Xcode (including beta)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and verify IPA
        env:
          IPA_OUTPUT_DIR: ${{ runner.temp }}/ios-ipa
        run: bash scripts/build-ios-ipa.sh "$IPA_OUTPUT_DIR"

      - name: Upload SideStore package
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LedgerMobile-SideStore-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-ipa/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Download and installation instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          IPA_OUTPUT_DIR: ${{ runner.temp }}/ios-ipa
        run: |
          {
            echo '## SideStore IPA'
            echo
            echo "[Download build artifact]($ARTIFACT_URL)"
            echo
            echo 'Extract the artifact ZIP, then import the .ipa into SideStore.'
            echo 'Keep both Widget and Share extensions, and renew with the same Apple ID.'
            echo 'Open Ledger after installation and unlock to refresh widget credentials.'
            echo
            echo '```text'
            cat "$IPA_OUTPUT_DIR/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
