name: iOS SideStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-private-ipa
  cancel-in-progress: false

jobs:
  ipa:
    name: Build private SideStore IPA
    # Manual owner-operated builds stay on the Mac. Public binary distribution
    # remains gated by App/LedgerMobile/Runtime/THIRD_PARTY.md.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, macOS, ARM64, ledger-ios]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The marketing version is read from the newest release tag, so the
          # checkout needs tag history and not just the packaging commit.
          fetch-depth: 0

      - name: Select Xcode
        run: bash .github/scripts/select-xcode.sh

      - name: Verify build tools
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/xcodegen --version
          go version
          python3 --version
          "$(/opt/homebrew/bin/brew --prefix bison)/bin/bison" --version
          "$(/opt/homebrew/bin/brew --prefix flex)/bin/flex" --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build and verify private IPA on the Mac
        env:
          IPA_OUTPUT_DIR: ${{ runner.temp }}/ios-private-ipa
        run: |
          umask 077
          private_root="$HOME/Downloads/LedgerMobile-PrivateBuilds"
          mkdir -p "$private_root"
          output_dir="$private_root/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash scripts/build-ios-ipa.sh --private-local "$output_dir"
          mkdir -p "$IPA_OUTPUT_DIR"
          cp -p "$output_dir"/* "$IPA_OUTPUT_DIR"/

      - name: Upload private IPA artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LedgerMobile-Private-SideStore-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-private-ipa/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Local installation instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## Private SideStore IPA'
            echo
            echo "[Download the private IPA artifact]($ARTIFACT_URL)"
            echo
            echo "On the Mac runner, open ~/Downloads/LedgerMobile-PrivateBuilds/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/"
            echo
            echo 'The artifact is available to authorized repository users for 7 days.'
            echo 'The Mac runner also keeps an owner-only local copy.'
            echo 'Import the local .ipa into SideStore for personal use.'
            echo 'Keep both Widget and Share extensions, and renew with the same Apple ID.'
            echo 'Open Ledger after installation and unlock to refresh widget credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
