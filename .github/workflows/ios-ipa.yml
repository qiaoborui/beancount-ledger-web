name: iOS SideStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-private-ipa
  cancel-in-progress: false

jobs:
  ipa:
    name: Build private SideStore IPA
    # Manual owner-operated builds stay on the Mac. Public binary distribution
    # remains gated by App/LedgerMobile/Runtime/THIRD_PARTY.md.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, macOS, ARM64, ledger-ios]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select latest installed Xcode (including beta)
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib
          import re

          candidates = []
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              developer = app / 'Contents/Developer'
              version_file = app / 'Contents/version.plist'
              if not version_file.is_file() or not (developer / 'usr/bin/xcodebuild').is_file():
                  continue
              with version_file.open('rb') as source:
                  info = plistlib.load(source)
              version = tuple(int(part) for part in info['CFBundleShortVersionString'].split('.'))
              version = version + (0,) * (3 - len(version))
              build = tuple((0, int(part)) if part.isdigit() else (1, part)
                            for part in re.findall(r'\d+|\D+', info['ProductBuildVersion']))
              stable = not re.search(r'\d[a-z]$', info['ProductBuildVersion'])
              candidates.append((version, stable, build, str(developer)))
          if not candidates:
              raise SystemExit('Install Xcode in /Applications and complete its first launch setup.')
          developer = max(candidates)[3]
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f'DEVELOPER_DIR={developer}\n')
          print(f'Selected {developer}')
          PY

      - name: Verify build tools
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          /opt/homebrew/bin/xcodegen --version
          go version
          python3 --version
          "$(/opt/homebrew/bin/brew --prefix bison)/bin/bison" --version
          "$(/opt/homebrew/bin/brew --prefix flex)/bin/flex" --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build and verify private IPA on the Mac
        env:
          IPA_OUTPUT_DIR: ${{ runner.temp }}/ios-private-ipa
        run: |
          umask 077
          private_root="$HOME/Downloads/LedgerMobile-PrivateBuilds"
          mkdir -p "$private_root"
          output_dir="$private_root/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash scripts/build-ios-ipa.sh --private-local "$output_dir"
          mkdir -p "$IPA_OUTPUT_DIR"
          cp -p "$output_dir"/* "$IPA_OUTPUT_DIR"/

      - name: Upload private IPA artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LedgerMobile-Private-SideStore-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-private-ipa/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Local installation instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## Private SideStore IPA'
            echo
            echo "[Download the private IPA artifact]($ARTIFACT_URL)"
            echo
            echo "On the Mac runner, open ~/Downloads/LedgerMobile-PrivateBuilds/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/"
            echo
            echo 'The artifact is available to authorized repository users for 7 days.'
            echo 'The Mac runner also keeps an owner-only local copy.'
            echo 'Import the local .ipa into SideStore for personal use.'
            echo 'Keep both Widget and Share extensions, and renew with the same Apple ID.'
            echo 'Open Ledger after installation and unlock to refresh widget credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
