name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ARTIFACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    name: Plan checks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      agent: ${{ steps.changes.outputs.agent }}
      web: ${{ steps.changes.outputs.web }}
      cloud_run: ${{ steps.changes.outputs.cloud_run }}
      zip_worker: ${{ steps.changes.outputs.zip_worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployment workflow guards
        run: bash .github/scripts/verify-deploy-google-cloud.sh

      - name: Detect changed components
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            files=""
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          else
            files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          backend=false
          agent=false
          web=false
          cloud_run=false
          zip_worker=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            backend=true
            agent=true
            web=true
            cloud_run=true
            zip_worker=true
          fi
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|Dockerfile.vercel|vercel.json|.dockerignore|docker/*|docker/**/*|.agents/*|.agents/**/*|server/*|server/**/*|examples/*|examples/**/*)
                backend=true
                ;;
            esac
            case "$file" in
              .github/workflows/*|.dockerignore|docker/*|docker/**/*|agent/*|agent/**/*)
                agent=true
                ;;
            esac
            case "$file" in
              .github/workflows/*|vercel.json|.dockerignore|docker/*|docker/**/*|web/*|web/**/*)
                web=true
                ;;
            esac
            case "$file" in
              .dockerignore|.github/workflows/deploy-google-cloud.yml|docker/Dockerfile|agent/*|agent/**/*|server/*|server/**/*|web/*|web/**/*)
                cloud_run=true
                ;;
            esac
            case "$file" in
              .dockerignore|.github/workflows/deploy-google-cloud.yml|docker/Dockerfile|server/*|server/**/*)
                zip_worker=true
                ;;
            esac
          done <<< "$files"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "cloud_run=$cloud_run" >> "$GITHUB_OUTPUT"
          echo "zip_worker=$zip_worker" >> "$GITHUB_OUTPUT"
          jq -n \
            --argjson cloud_run "$cloud_run" \
            --argjson zip_worker "$zip_worker" \
            '{cloud_run: $cloud_run, zip_worker: $zip_worker}' \
            > cloud-run-plan.json
          {
            echo "## CI plan"
            echo
            echo "- Backend: \`$backend\`"
            echo "- Agent: \`$agent\`"
            echo "- Web: \`$web\`"
            echo "- Cloud Run: \`$cloud_run\`"
            echo "- ZIP worker: \`$zip_worker\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Cloud Run deployment plan
        uses: actions/upload-artifact@v4
        with:
          name: cloud-run-plan
          path: cloud-run-plan.json
          retention-days: 1

  go:
    name: Backend
    needs: plan
    if: ${{ needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go test ./...
      - name: Build
        working-directory: server
        run: go build ./cmd/...
      - name: Validate complete self-hosted Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET: ci-auth-secret
          APP_PASSWORD: ci-app-password
          AGENT_SERVICE_TOKEN: ci-agent-service-token
        run: docker compose --env-file .env.selfhost.example -f docker/docker-compose.selfhost.yml config --quiet

  agent:
    name: Bub Agent
    needs: plan
    if: ${{ needs.plan.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: agent
        run: uv sync --frozen --python 3.12
      - name: Test
        working-directory: agent
        run: uv run pytest
      - name: Compile
        working-directory: agent
        run: uv run python -m compileall -q src tests
      - name: Validate complete self-hosted Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET: ci-auth-secret
          APP_PASSWORD: ci-app-password
          AGENT_SERVICE_TOKEN: ci-agent-service-token
        run: docker compose --env-file .env.selfhost.example -f docker/docker-compose.selfhost.yml config --quiet

  agent-image:
    name: Agent image
    needs: [plan, agent]
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=beancount-ledger-web-agent
            org.opencontainers.image.description=Bub Agent runtime with PostgreSQL tape storage
      - name: Build Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent-image
          cache-to: type=gha,scope=agent-image,mode=max

  server-image:
    name: Server image
    needs: [plan, go]
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=beancount-ledger-web-server
            org.opencontainers.image.description=Minimal stateless ledger-web API server image
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vercel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max

  indexer-image:
    name: Indexer image
    needs: [plan, go]
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-indexer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=beancount-ledger-web-indexer
            org.opencontainers.image.description=Ledger read-model indexer image
      - name: Build indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: indexer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=indexer-image
          cache-to: type=gha,scope=indexer-image,mode=max

  frontend-image:
    name: Frontend image
    needs: [plan, web]
    if: ${{ github.event_name != 'pull_request' && needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=beancount-ledger-web-frontend
            org.opencontainers.image.description=Static frontend image for Beancount Ledger Web
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,scope=frontend-image,mode=max

  web:
    name: Frontend
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm run typecheck
      - name: Test
        working-directory: web
        run: pnpm run test
      - name: Audit high severity vulnerabilities
        working-directory: web
        run: pnpm audit --audit-level=high --ignore-registry-errors
      - name: Build
        working-directory: web
        run: pnpm run build
