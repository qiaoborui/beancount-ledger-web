name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      backend:
        required: true
        type: boolean
      agent:
        required: true
        type: boolean
      web:
        required: true
        type: boolean
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan checks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      agent: ${{ steps.changes.outputs.agent }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployment workflow guards
        if: ${{ github.event_name != 'workflow_call' }}
        run: bash .github/scripts/verify-deploy-google-cloud.sh

      - name: Detect changed components
        id: changes
        env:
          INPUT_BACKEND: ${{ inputs.backend }}
          INPUT_AGENT: ${{ inputs.agent }}
          INPUT_WEB: ${{ inputs.web }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            backend="${INPUT_BACKEND}"
            agent="${INPUT_AGENT}"
            web="${INPUT_WEB}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            plan_json="$(.github/scripts/plan-components.sh --all)"
            backend="$(jq -r '.backend' <<< "$plan_json")"
            agent="$(jq -r '.agent' <<< "$plan_json")"
            web="$(jq -r '.web' <<< "$plan_json")"
          else
            files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            plan_json="$(printf '%s\n' "$files" | .github/scripts/plan-components.sh)"
            backend="$(jq -r '.backend' <<< "$plan_json")"
            agent="$(jq -r '.agent' <<< "$plan_json")"
            web="$(jq -r '.web' <<< "$plan_json")"
          fi

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "agent=${agent}" >> "$GITHUB_OUTPUT"
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          {
            echo "## CI plan"
            echo
            echo "- Backend: \`${backend}\`"
            echo "- Agent: \`${agent}\`"
            echo "- Web: \`${web}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  go:
    name: Backend
    needs: plan
    if: ${{ needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go test ./...
      - name: Build
        working-directory: server
        run: go build ./cmd/...
      - name: Validate complete self-hosted Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET: ci-auth-secret
          APP_PASSWORD: ci-app-password
          AGENT_SERVICE_TOKEN: ci-agent-service-token
        run: docker compose --env-file .env.selfhost.example -f docker/docker-compose.selfhost.yml config --quiet

  agent:
    name: Bub Agent
    needs: plan
    if: ${{ needs.plan.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: agent
        run: uv sync --frozen --python 3.12
      - name: Test
        working-directory: agent
        run: uv run pytest
      - name: Compile
        working-directory: agent
        run: uv run python -m compileall -q src tests
      - name: Validate complete self-hosted Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET: ci-auth-secret
          APP_PASSWORD: ci-app-password
          AGENT_SERVICE_TOKEN: ci-agent-service-token
        run: docker compose --env-file .env.selfhost.example -f docker/docker-compose.selfhost.yml config --quiet

  web:
    name: Frontend
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm run typecheck
      - name: Test
        working-directory: web
        run: pnpm run test
      - name: Audit high severity vulnerabilities
        working-directory: web
        run: pnpm audit --audit-level=high --ignore-registry-errors
      - name: Build
        working-directory: web
        run: pnpm run build
