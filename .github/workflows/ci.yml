name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      reusable_call:
        required: true
        type: boolean
      backend:
        required: true
        type: boolean
      agent:
        required: true
        type: boolean
      web:
        required: true
        type: boolean
      ios:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan checks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      agent: ${{ steps.changes.outputs.agent }}
      web: ${{ steps.changes.outputs.web }}
      ios: ${{ steps.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify deployment workflow guards
        run: bash .github/scripts/verify-deploy-google-cloud.sh

      - name: Verify self-hosted deployment guards
        run: bash .github/scripts/verify-deploy-selfhost.sh

      - name: Test self-hosted deployment manifest validation
        run: bash .github/scripts/test-deploy-selfhost-submit.sh

      - name: Verify private IPA packaging guards
        run: python3 scripts/test_ios_private_ipa.py

      # Static Compose validation runs once here instead of in both the backend
      # and agent jobs, which each repeated it.
      - name: Validate complete self-hosted Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET: ci-auth-secret
          APP_PASSWORD: ci-app-password
          AGENT_SERVICE_TOKEN: ci-agent-service-token
        run: docker compose --env-file .env.selfhost.example -f docker/docker-compose.selfhost.yml config --quiet

      - name: Detect changed components
        id: changes
        env:
          INPUT_REUSABLE_CALL: ${{ inputs.reusable_call }}
          INPUT_BACKEND: ${{ inputs.backend }}
          INPUT_AGENT: ${{ inputs.agent }}
          INPUT_WEB: ${{ inputs.web }}
          INPUT_IOS: ${{ inputs.ios }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "${INPUT_REUSABLE_CALL}" == "true" ]]; then
            backend="${INPUT_BACKEND}"
            agent="${INPUT_AGENT}"
            web="${INPUT_WEB}"
            ios="${INPUT_IOS:-false}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            plan_json="$(.github/scripts/plan-components.sh --all)"
            backend="$(jq -r '.backend' <<< "$plan_json")"
            agent="$(jq -r '.agent' <<< "$plan_json")"
            web="$(jq -r '.web' <<< "$plan_json")"
          else
            files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            plan_json="$(printf '%s\n' "$files" | .github/scripts/plan-components.sh)"
            backend="$(jq -r '.backend' <<< "$plan_json")"
            agent="$(jq -r '.agent' <<< "$plan_json")"
            web="$(jq -r '.web' <<< "$plan_json")"
            ios="$(jq -r '.ios' <<< "$plan_json")"
          fi

          # The iOS job runs on the owner's self-hosted Mac, so fork pull
          # requests never reach it: their code is unreviewed and a self-hosted
          # runner would execute it with the runner's own machine access.
          if [[ -n "${PR_HEAD_REPOSITORY}" && "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::notice::skipping the iOS job for a fork pull request"
            ios=false
          fi

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "agent=${agent}" >> "$GITHUB_OUTPUT"
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "ios=${ios}" >> "$GITHUB_OUTPUT"
          {
            echo "## CI plan"
            echo
            echo "- Backend: \`${backend}\`"
            echo "- Agent: \`${agent}\`"
            echo "- Web: \`${web}\`"
            echo "- iOS: \`${ios}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  go:
    name: Backend
    needs: plan
    if: ${{ needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ledger validator
        run: python -m pip install beancount==3.2.3
      - name: Test
        working-directory: server
        run: go test ./...
      - name: GitHub write performance gate
        working-directory: server
        env:
          LEDGER_VALIDATION_PERFORMANCE_REQUIRED: "1"
        run: go test ./internal/app -run '^TestGitHubWriteValidationLargeLedgerPerformance$' -count=1 -v
      - name: Build
        working-directory: server
        run: go build ./cmd/...

  agent:
    name: Bub Agent
    needs: plan
    if: ${{ needs.plan.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: agent
        run: uv sync --frozen --python 3.12
      - name: Test
        working-directory: agent
        run: uv run pytest
      - name: Compile
        working-directory: agent
        run: uv run python -m compileall -q src tests

  web:
    name: Frontend
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.11.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm run typecheck
      - name: Test
        working-directory: web
        run: pnpm run test
      - name: Audit high severity vulnerabilities
        working-directory: web
        run: pnpm audit --audit-level=high --ignore-registry-errors
      - name: Build
        working-directory: web
        run: pnpm run build

  ios:
    name: iOS core
    needs: plan
    if: ${{ needs.plan.outputs.ios == 'true' }}
    # `swift test` needs a full Xcode; the self-hosted Mac is the only runner
    # with one, and it is the machine the IPA is built on.
    runs-on: [self-hosted, macOS, ARM64, ledger-ios]
    timeout-minutes: 30
    steps:
      # Self-hosted runners keep the workspace between jobs, so never leave the
      # job's credentials in its git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: bash .github/scripts/select-xcode.sh
      - name: Test portable Swift package
        working-directory: App/LedgerMobile
        run: swift test

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [plan, go, agent, web, ios]
    runs-on: ubuntu-latest
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      BACKEND_REQUIRED: ${{ needs.plan.outputs.backend }}
      BACKEND_RESULT: ${{ needs.go.result }}
      AGENT_REQUIRED: ${{ needs.plan.outputs.agent }}
      AGENT_RESULT: ${{ needs.agent.result }}
      WEB_REQUIRED: ${{ needs.plan.outputs.web }}
      WEB_RESULT: ${{ needs.web.result }}
      IOS_REQUIRED: ${{ needs.plan.outputs.ios }}
      IOS_RESULT: ${{ needs.ios.result }}
    steps:
      - name: Require every planned check to pass
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::CI planning failed"
            exit 1
          fi

          check_result() {
            local component="$1"
            local required="$2"
            local result="$3"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "::error::${component} was required but finished with ${result}"
              return 1
            fi
            if [[ "$required" != "true" && "$result" != "skipped" ]]; then
              echo "::error::${component} was not required but finished with ${result}"
              return 1
            fi
          }

          check_result Backend "$BACKEND_REQUIRED" "$BACKEND_RESULT"
          check_result Agent "$AGENT_REQUIRED" "$AGENT_RESULT"
          check_result Frontend "$WEB_REQUIRED" "$WEB_RESULT"
          check_result iOS "$IOS_REQUIRED" "$IOS_RESULT"
