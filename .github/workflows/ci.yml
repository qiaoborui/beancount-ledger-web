name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ui_tests:
        description: Also run the iOS UI tests (slow, and flaky on a loaded machine)
        type: boolean
        default: false

permissions:
  contents: read

# Every job below is one area. .github/scripts/plan-components.sh maps the
# changed paths of a pull request to areas; a manual run checks every area.
# The iOS UI tests are the exception: they run only when a manual run asks.
jobs:
  plan:
    name: Plan checks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      agent: ${{ steps.changes.outputs.agent }}
      web: ${{ steps.changes.outputs.web }}
      ios: ${{ steps.changes.outputs.ios }}
      ios_app: ${{ steps.changes.outputs.ios_app }}
      ios_widgets: ${{ steps.changes.outputs.ios_widgets }}
      ios_ui: ${{ steps.changes.outputs.ios_ui }}
      ios_runtime: ${{ steps.changes.outputs.ios_runtime }}
      selfhost: ${{ steps.changes.outputs.selfhost }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the area planner
        run: python3 .github/scripts/test_plan_components.py

      - name: Detect changed areas
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          UI_TESTS: ${{ inputs.ui_tests == true }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            plan_json="$(.github/scripts/plan-components.sh --all)"
          else
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            plan_json="$(printf '%s\n' "$changed" | .github/scripts/plan-components.sh)"
            {
              echo "## Changed files"
              echo
              echo '```'
              echo "$changed"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          plan_json="$(jq -c --argjson ui "$UI_TESTS" '. + {ios_ui: $ui}' <<< "$plan_json")"

          # The iOS jobs run on the owner's self-hosted Mac, so fork pull
          # requests never reach them: their code is unreviewed and a
          # self-hosted runner would execute it with the runner's own machine
          # access.
          if [[ -n "${PR_HEAD_REPOSITORY}" && "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::notice::skipping the iOS jobs for a fork pull request"
            plan_json="$(jq -c '.ios = false | .ios_app = false | .ios_widgets = false | .ios_ui = false' <<< "$plan_json")"
          fi

          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$plan_json" >> "$GITHUB_OUTPUT"
          {
            echo "## CI plan"
            echo
            jq -r 'to_entries[] | "- \(.key): `\(.value)`"' <<< "$plan_json"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    needs: plan
    if: ${{ needs.plan.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ledger validator
        run: python -m pip install beancount==3.2.3
      - name: Test
        working-directory: server
        run: go test ./...
      - name: GitHub write performance gate
        working-directory: server
        env:
          LEDGER_VALIDATION_PERFORMANCE_REQUIRED: "1"
        run: go test ./internal/app -run '^TestGitHubWriteValidationLargeLedgerPerformance$' -count=1 -v
      - name: Build
        working-directory: server
        run: go build ./cmd/...

  agent:
    name: Bub Agent
    needs: plan
    if: ${{ needs.plan.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: agent
        run: uv sync --frozen --python 3.12
      - name: Test
        working-directory: agent
        run: uv run pytest
      - name: Compile
        working-directory: agent
        run: uv run python -m compileall -q src tests

  web:
    name: Frontend
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.11.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm run typecheck
      - name: Test
        working-directory: web
        run: pnpm run test
      - name: Audit high severity vulnerabilities
        working-directory: web
        run: pnpm audit --audit-level=high --ignore-registry-errors
      - name: Build
        working-directory: web
        run: pnpm run build

  ios:
    name: iOS core
    needs: plan
    if: ${{ needs.plan.outputs.ios == 'true' }}
    # `swift test` needs a full Xcode; the self-hosted Mac is the only runner
    # with one, and it is the machine the IPA is built on.
    runs-on: [self-hosted, macOS, ARM64, ledger-ios]
    timeout-minutes: 30
    steps:
      # Self-hosted runners keep the workspace between jobs, so never leave the
      # job's credentials in its git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: bash .github/scripts/select-xcode.sh
      - name: Test portable Swift package
        working-directory: App/LedgerMobile
        run: swift test
      # `swift test` builds for macOS, where `canImport(UIKit)` is false, so an
      # iOS-only compile error (SwiftUI `Font`, a missing import) passes there
      # and only fails the IPA build. Cross-compiling for the device SDK catches
      # it in the same job.
      - name: Build for the iOS SDK
        working-directory: App/LedgerMobile
        run: |
          swift build --triple arm64-apple-ios17.0 \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"

  # The Swift package leaves out the app's UI layer, widgets and share
  # extension, so iOS core never compiles them. These jobs build the Xcode
  # schemes for a simulator. They share the one self-hosted Mac, so they queue
  # behind each other rather than run in parallel.
  ios_app:
    name: iOS app
    needs: plan
    if: ${{ needs.plan.outputs.ios_app == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, ledger-ios]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app scheme and run its unit tests
        run: bash .github/scripts/ios-app-check.sh app

  ios_widgets:
    name: iOS widgets
    needs: plan
    if: ${{ needs.plan.outputs.ios_widgets == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, ledger-ios]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the widget scheme and run its tests
        run: bash .github/scripts/ios-app-check.sh widgets

  ios_ui:
    name: iOS UI tests
    needs: plan
    if: ${{ needs.plan.outputs.ios_ui == 'true' }}
    runs-on: [self-hosted, macOS, ARM64, ledger-ios]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app scheme and run its UI tests
        run: bash .github/scripts/ios-app-check.sh ui-tests

  ios_runtime:
    name: iOS Beancount runtime
    needs: plan
    if: ${{ needs.plan.outputs.ios_runtime == 'true' }}
    # The app's Python validator (preflight, canonical export, loader cache and
    # booking checkpoint) only needs CPython and the pinned Beancount, so it
    # runs on a hosted runner rather than the self-hosted Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ledger validator
        run: python -m pip install beancount==3.2.3
      - name: Test
        working-directory: App/LedgerMobile/Runtime
        run: python -m unittest -v test_ledger_validator

  selfhost:
    name: Self-hosted stack
    needs: plan
    if: ${{ needs.plan.outputs.selfhost == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate complete self-hosted Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          AUTH_SECRET: ci-auth-secret
          APP_PASSWORD: ci-app-password
          AGENT_SERVICE_TOKEN: ci-agent-service-token
        run: docker compose --env-file .env.selfhost.example -f docker/docker-compose.selfhost.yml config --quiet
      - name: Test deployment manifest validation
        run: bash .github/scripts/test-deploy-selfhost-submit.sh

  release:
    name: Release tooling
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test private IPA packaging guards
        run: python3 scripts/test_ios_private_ipa.py
      - name: Test SideStore source publishing
        run: python3 scripts/test_sidestore_publish.py

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [plan, backend, agent, web, ios, ios_app, ios_widgets, ios_ui, ios_runtime, selfhost, release]
    runs-on: ubuntu-latest
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every planned check to pass
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(jq -r '.plan.result' <<< "$NEEDS")" != "success" ]]; then
            echo "::error::CI planning failed"
            exit 1
          fi

          # Job IDs are area names, so each job's requirement is the plan
          # output of the same name. A planned job must succeed; an unplanned
          # one must have been skipped.
          failed=0
          while read -r job required result; do
            echo "${job}: required=${required} result=${result}"
            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "::error::${job} was required but finished with ${result}"
              failed=1
            elif [[ "$required" != "true" && "$result" != "skipped" ]]; then
              echo "::error::${job} was not required but finished with ${result}"
              failed=1
            fi
          done < <(jq -r '.plan.outputs as $plan
            | del(.plan) | to_entries[]
            | "\(.key) \($plan[.key] // "false") \(.value.result)"' <<< "$NEEDS")
          exit "$failed"
