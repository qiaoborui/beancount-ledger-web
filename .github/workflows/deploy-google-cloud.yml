name: Deploy Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'beancount-ledger-web' }}
  CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'beancount-ledger-web' }}
  AGENT_SERVICE: ${{ vars.GCP_AGENT_SERVICE || 'beancount-ledger-agent' }}
  ZIP_WORKER_SERVICE: ${{ vars.GCP_ZIP_WORKER_SERVICE || 'beancount-ledger-zip-worker' }}
  BUB_MODEL: ${{ vars.BUB_MODEL || 'openai:ledger-agent' }}
  BUB_TELEGRAM_ALLOW_USERS: ${{ vars.BUB_TELEGRAM_ALLOW_USERS }}
  BUB_TELEGRAM_ALLOW_CHATS: ${{ vars.BUB_TELEGRAM_ALLOW_CHATS }}
  DEEPSEEK_SECRET_NAME: ${{ vars.GCP_DEEPSEEK_SECRET }}

jobs:
  plan:
    name: Plan pipeline
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      agent: ${{ steps.changes.outputs.agent }}
      web: ${{ steps.changes.outputs.web }}
      cloud_run: ${{ steps.changes.outputs.cloud_run }}
      agent_service: ${{ steps.changes.outputs.agent_service }}
      zip_worker: ${{ steps.changes.outputs.zip_worker }}
      deploy_any: ${{ steps.changes.outputs.deploy_any }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify deployment workflow guards
        run: bash .github/scripts/verify-deploy-google-cloud.sh

      - name: Detect changed components
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            files=""
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
          else
            files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            plan_json="$(.github/scripts/plan-components.sh --all)"
          else
            plan_json="$(printf '%s\n' "$files" | .github/scripts/plan-components.sh)"
          fi

          backend="$(jq -r '.backend' <<< "$plan_json")"
          agent="$(jq -r '.agent' <<< "$plan_json")"
          web="$(jq -r '.web' <<< "$plan_json")"
          cloud_run="$(jq -r '.cloud_run' <<< "$plan_json")"
          agent_service="$(jq -r '.agent_service' <<< "$plan_json")"
          zip_worker="$(jq -r '.zip_worker' <<< "$plan_json")"
          deploy_any="$(jq -r '.deploy_any' <<< "$plan_json")"

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "agent=${agent}" >> "$GITHUB_OUTPUT"
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "cloud_run=${cloud_run}" >> "$GITHUB_OUTPUT"
          echo "agent_service=${agent_service}" >> "$GITHUB_OUTPUT"
          echo "zip_worker=${zip_worker}" >> "$GITHUB_OUTPUT"
          echo "deploy_any=${deploy_any}" >> "$GITHUB_OUTPUT"
          jq -n \
            --argjson backend "$backend" \
            --argjson agent "$agent" \
            --argjson web "$web" \
            '{backend: $backend, agent: $agent, web: $web}' \
            > container-publish-plan.json
          {
            echo "## Production pipeline plan"
            echo
            echo "- Backend checks: \`${backend}\`"
            echo "- Agent checks: \`${agent}\`"
            echo "- Web checks: \`${web}\`"
            echo "- Cloud Run app: \`${cloud_run}\`"
            echo "- Bub Agent service: \`${agent_service}\`"
            echo "- ZIP worker: \`${zip_worker}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Application checks
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      reusable_call: true
      backend: ${{ needs.plan.outputs.backend == 'true' }}
      agent: ${{ needs.plan.outputs.agent == 'true' }}
      web: ${{ needs.plan.outputs.web == 'true' }}

  build-standalone:
    name: Build Cloud Run app
    needs: plan
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          needs.plan.outputs.cloud_run == 'true' &&
          vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_BUILD_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve image name
        id: image
        run: |
          base="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          echo "name=${base}/${CLOUD_RUN_SERVICE}" >> "$GITHUB_OUTPUT"
      - name: Build and push standalone image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: standalone
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=cloud-run-standalone
          cache-to: type=gha,scope=cloud-run-standalone,mode=max

  build-agent:
    name: Build Bub Agent
    needs: plan
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          needs.plan.outputs.agent_service == 'true' &&
          vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_BUILD_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve image name
        id: image
        run: |
          base="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          echo "name=${base}/${AGENT_SERVICE}" >> "$GITHUB_OUTPUT"
      - name: Build and push Bub Agent image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: agent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=cloud-run-agent
          cache-to: type=gha,scope=cloud-run-agent,mode=max

  build-zip-worker:
    name: Build ZIP worker
    needs: plan
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          needs.plan.outputs.zip_worker == 'true' &&
          vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_BUILD_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve image name
        id: image
        run: |
          base="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          echo "name=${base}/${ZIP_WORKER_SERVICE}" >> "$GITHUB_OUTPUT"
      - name: Build and push ZIP worker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: zip-worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=cloud-run-zip-worker
          cache-to: type=gha,scope=cloud-run-zip-worker,mode=max

  deploy:
    name: Verify and deploy Cloud Run
    needs: [plan, checks, build-standalone, build-agent, build-zip-worker]
    if: >-
      ${{ always() &&
          github.ref == 'refs/heads/main' &&
          needs.plan.outputs.deploy_any == 'true' &&
          needs.checks.result == 'success' &&
          (needs.plan.outputs.cloud_run != 'true' || needs.build-standalone.result == 'success') &&
          (needs.plan.outputs.agent_service != 'true' || needs.build-agent.result == 'success') &&
          (needs.plan.outputs.zip_worker != 'true' || needs.build-zip-worker.result == 'success') &&
          vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' &&
          vars.GCP_RUNTIME_SERVICE_ACCOUNT != '' &&
          vars.GCP_ZIP_WORKER_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    environment: google-cloud-production
    concurrency:
      group: google-cloud-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify current main commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ -z "${current_main}" ]]; then
            echo "::error::could not resolve the current main branch commit"
            exit 1
          fi
          if [[ "${GITHUB_SHA}" != "${current_main}" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit is available; skipping this deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: ${{ steps.freshness.outputs.proceed == 'true' }}

      - name: Authenticate to Google Cloud
        if: ${{ steps.freshness.outputs.proceed == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        if: ${{ steps.freshness.outputs.proceed == 'true' }}

      - name: Deploy private ZIP worker
        id: deploy-zip-worker
        if: ${{ steps.freshness.outputs.proceed == 'true' && needs.plan.outputs.zip_worker == 'true' }}
        env:
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_ZIP_WORKER_SERVICE_ACCOUNT: ${{ vars.GCP_ZIP_WORKER_SERVICE_ACCOUNT }}
        run: |
          worker_image="${{ needs.build-zip-worker.outputs.image }}@${{ needs.build-zip-worker.outputs.digest }}"
          gcloud run deploy "${ZIP_WORKER_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${worker_image}" \
            --service-account="${GCP_ZIP_WORKER_SERVICE_ACCOUNT}" \
            --execution-environment=gen2 \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --cpu=8 \
            --memory=4Gi \
            --cpu-throttling \
            --concurrency=1 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=900s \
            --set-env-vars=ZIP_WORKERS=8 \
            --quiet

          policy_file="$(mktemp)"
          jq -n \
            --arg member "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            '{bindings: [{role: "roles/run.invoker", members: [$member]}]}' \
            > "${policy_file}"
          gcloud run services set-iam-policy "${ZIP_WORKER_SERVICE}" "${policy_file}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --quiet
          rm -f "${policy_file}"

          expected_invokers="$(jq -cn --arg member "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" '[$member]')"
          actual_invokers="$(gcloud run services get-iam-policy "${ZIP_WORKER_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json \
            | jq -c '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]?] | sort')"
          if [[ "${actual_invokers}" != "${expected_invokers}" ]]; then
            echo "::error::ZIP worker invoker policy is broader than the runtime service account"
            exit 1
          fi

          worker_url="$(gcloud run services describe "${ZIP_WORKER_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          if [[ "${worker_url}" != https://* ]]; then
            echo "::error::ZIP worker URL was not published"
            exit 1
          fi
          echo "url=${worker_url}" >> "$GITHUB_OUTPUT"
          echo "ZIP Worker: ${worker_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag deployed ZIP worker image as latest
        if: ${{ steps.freshness.outputs.proceed == 'true' && needs.plan.outputs.zip_worker == 'true' }}
        run: .github/scripts/update-artifact-latest-tag.sh "${ZIP_WORKER_SERVICE}" "${{ needs.build-zip-worker.outputs.digest }}"

      - name: Deploy private Bub Agent
        id: deploy-agent
        if: ${{ steps.freshness.outputs.proceed == 'true' && needs.plan.outputs.agent_service == 'true' }}
        env:
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          CLOUD_RUN_SECRET_MAPPINGS: ${{ secrets.CLOUD_RUN_SECRET_MAPPINGS }}
        run: |
          for name in DATABASE_URL AGENT_SERVICE_TOKEN; do
            if [[ ",${CLOUD_RUN_SECRET_MAPPINGS}," != *",${name}="* ]]; then
              echo "::error::CLOUD_RUN_SECRET_MAPPINGS must define ${name}"
              exit 1
            fi
          done
          if [[ "${PUBLIC_ORIGIN}" != https://* ]]; then
            echo "::error::PUBLIC_ORIGIN must use HTTPS"
            exit 1
          fi

          agent_secret_mappings="$(tr ',' '\n' <<<"${CLOUD_RUN_SECRET_MAPPINGS}" \
            | awk -F= '$1 == "DATABASE_URL" || $1 == "AGENT_SERVICE_TOKEN" || $1 == "BUB_TELEGRAM_TOKEN"' \
            | paste -sd, -)"
          agent_image="${{ needs.build-agent.outputs.image }}@${{ needs.build-agent.outputs.digest }}"
          agent_env="^|^LEDGER_API_URL=${PUBLIC_ORIGIN}|BUB_MODEL=${BUB_MODEL}|BUB_API_BASE=${PUBLIC_ORIGIN}/api/internal/agent/model|BUB_TELEGRAM_ALLOW_USERS=${BUB_TELEGRAM_ALLOW_USERS}|BUB_TELEGRAM_ALLOW_CHATS=${BUB_TELEGRAM_ALLOW_CHATS}"
          agent_runtime_args=(--cpu-throttling --min-instances=0)
          if [[ ",${agent_secret_mappings}," == *",BUB_TELEGRAM_TOKEN="* ]]; then
            if [[ -z "${BUB_TELEGRAM_ALLOW_USERS}" && -z "${BUB_TELEGRAM_ALLOW_CHATS}" ]]; then
              echo "::error::BUB_TELEGRAM_ALLOW_USERS or BUB_TELEGRAM_ALLOW_CHATS is required when Telegram is enabled"
              exit 1
            fi
            agent_runtime_args=(--no-cpu-throttling --min-instances=1)
          fi
          gcloud run deploy "${AGENT_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${agent_image}" \
            --service-account="${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --execution-environment=gen2 \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=8 \
            "${agent_runtime_args[@]}" \
            --max-instances=1 \
            --timeout=900s \
            --set-env-vars="${agent_env}" \
            --set-secrets="${agent_secret_mappings}" \
            --quiet

          policy_file="$(mktemp)"
          jq -n \
            --arg member "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            '{bindings: [{role: "roles/run.invoker", members: [$member]}]}' \
            > "${policy_file}"
          gcloud run services set-iam-policy "${AGENT_SERVICE}" "${policy_file}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --quiet
          rm -f "${policy_file}"

          agent_url="$(gcloud run services describe "${AGENT_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          if [[ "${agent_url}" != https://* ]]; then
            echo "::error::Bub Agent URL was not published"
            exit 1
          fi
          ready="$(gcloud run services describe "${AGENT_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.conditions[0].status)')"
          if [[ "${ready}" != "True" ]]; then
            echo "::error::Bub Agent service is not ready"
            exit 1
          fi
          echo "url=${agent_url}" >> "$GITHUB_OUTPUT"
          echo "Bub Agent: ${agent_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag deployed Bub Agent image as latest
        if: ${{ steps.freshness.outputs.proceed == 'true' && needs.plan.outputs.agent_service == 'true' }}
        run: .github/scripts/update-artifact-latest-tag.sh "${AGENT_SERVICE}" "${{ needs.build-agent.outputs.digest }}"

      - name: Deploy Cloud Run service
        id: deploy-candidate
        if: ${{ steps.freshness.outputs.proceed == 'true' && needs.plan.outputs.cloud_run == 'true' }}
        env:
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          LEDGER_GITHUB_OWNER: ${{ vars.LEDGER_GITHUB_OWNER }}
          LEDGER_GITHUB_REPO: ${{ vars.LEDGER_GITHUB_REPO }}
          LEDGER_GIT_BRANCH: ${{ vars.LEDGER_GIT_BRANCH || 'main' }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_PUBLIC_ORIGIN: ${{ vars.WEBAUTHN_PUBLIC_ORIGIN || vars.PUBLIC_ORIGIN }}
          CLOUD_RUN_EXTRA_ENV_VARS: ${{ vars.CLOUD_RUN_EXTRA_ENV_VARS }}
          CLOUD_RUN_SECRET_MAPPINGS: ${{ secrets.CLOUD_RUN_SECRET_MAPPINGS }}
          DEPLOYED_WORKER_URL: ${{ steps.deploy-zip-worker.outputs.url }}
          DEPLOYED_AGENT_URL: ${{ steps.deploy-agent.outputs.url }}
        run: |
          ZIP_WORKER_URL="${DEPLOYED_WORKER_URL}"
          AGENT_SERVICE_URL="${DEPLOYED_AGENT_URL}"
          if [[ -z "${ZIP_WORKER_URL}" ]]; then
            ZIP_WORKER_URL="$(gcloud run services describe "${ZIP_WORKER_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          fi
          if [[ -z "${AGENT_SERVICE_URL}" ]]; then
            AGENT_SERVICE_URL="$(gcloud run services describe "${AGENT_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          fi
          if [[ "${ZIP_WORKER_URL}" != https://* ]]; then
            echo "::error::ZIP worker URL was not published; run a manual deployment to create it"
            exit 1
          fi
          if [[ "${AGENT_SERVICE_URL}" != https://* ]]; then
            echo "::error::Bub Agent URL was not published"
            exit 1
          fi

          required_values=(
            GCP_PROJECT_ID
            GCP_REGION
            CLOUD_RUN_SERVICE
            GCP_RUNTIME_SERVICE_ACCOUNT
            PUBLIC_ORIGIN
            WEBAUTHN_RP_ID
            CLOUD_RUN_SECRET_MAPPINGS
            ZIP_WORKER_URL
            AGENT_SERVICE_URL
          )
          for name in "${required_values[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is required"
              exit 1
            fi
          done

          for name in AUTH_SECRET DATABASE_URL AGENT_SERVICE_TOKEN; do
            if [[ ",${CLOUD_RUN_SECRET_MAPPINGS}," != *",${name}="* ]]; then
              echo "::error::CLOUD_RUN_SECRET_MAPPINGS must define ${name}"
              exit 1
            fi
          done

          if [[ "${PUBLIC_ORIGIN}" != https://* ]]; then
            echo "::error::PUBLIC_ORIGIN must use HTTPS"
            exit 1
          fi

          for name in ZIP_WORKER_URL ZIP_WORKER_AUDIENCE AGENT_SERVICE_URL AGENT_SERVICE_AUDIENCE; do
            if [[ "|${CLOUD_RUN_EXTRA_ENV_VARS}|" == *"|${name}="* ]]; then
              echo "::error::${name} is managed by the deployment workflow"
              exit 1
            fi
          done

          previous_traffic=""
          service_existed=false
          legacy_migration_required=false
          existing_service="$(gcloud run services list --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --filter="metadata.name=${CLOUD_RUN_SERVICE}" --format='value(metadata.name)')"
          if [[ "${existing_service}" == "${CLOUD_RUN_SERVICE}" ]]; then
            service_existed=true
            service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
            previous_traffic="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0 and .revisionName != null) | "\(.revisionName)=\(.percent)"] | sort | join(",")' <<<"${service_json}")"
            service_url="$(jq -r '.status.url // empty' <<<"${service_json}")"
            current_health=""
            if [[ "${service_url}" == https://* ]]; then
              current_health="$(curl --silent --show-error --connect-timeout 10 --max-time 30 "${service_url}/api/health" || true)"
            fi
            legacy_environment_present="$(jq -r '[.spec.template.spec.containers[0].env[]?.name] | any(. == "APP_PASSWORD" or . == "LEDGER_GITHUB_TOKEN" or . == "LEDGER_GITHUB_OWNER" or . == "LEDGER_GITHUB_REPO")' <<<"${service_json}")"
            if [[ "$(jq -r '.configSource // empty' <<<"${current_health}" 2>/dev/null || true)" != "database" && "${legacy_environment_present}" == "true" ]]; then
              legacy_migration_required=true
            fi
          elif [[ -n "${existing_service}" ]]; then
            echo "::error::Cloud Run service lookup returned an unexpected result"
            exit 1
          fi

          platform_secret_mappings="$(tr ',' '\n' <<<"${CLOUD_RUN_SECRET_MAPPINGS}" \
            | awk -F= '$1 != "APP_PASSWORD" && $1 != "LEDGER_GITHUB_TOKEN" && $1 != "LEDGER_GITHUB_INDEX_TOKEN" && $1 != "DEEPSEEK_API_KEY" && $1 != "OPENAI_API_KEY" && $1 != "BUB_TELEGRAM_TOKEN"' \
            | paste -sd, -)"
          candidate_secret_mappings="${platform_secret_mappings}"
          env_vars="^|^PUBLIC_ORIGIN=${PUBLIC_ORIGIN}|WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}|WEBAUTHN_PUBLIC_ORIGIN=${WEBAUTHN_PUBLIC_ORIGIN}|LEDGER_NOTIFICATION_REFRESH_INTERVAL=off|ZIP_WORKER_URL=${ZIP_WORKER_URL}|ZIP_WORKER_AUDIENCE=${ZIP_WORKER_URL}|AGENT_SERVICE_URL=${AGENT_SERVICE_URL}|AGENT_SERVICE_AUDIENCE=${AGENT_SERVICE_URL}"
          if [[ "${legacy_migration_required}" == "true" ]]; then
            for name in LEDGER_GITHUB_OWNER LEDGER_GITHUB_REPO; do
              if [[ -z "${!name}" ]]; then
                echo "::error::${name} is required for the one-time legacy runtime configuration migration"
                exit 1
              fi
            done
            for name in APP_PASSWORD LEDGER_GITHUB_TOKEN; do
              if [[ ",${CLOUD_RUN_SECRET_MAPPINGS}," != *",${name}="* ]]; then
                echo "::error::existing services require legacy ${name} for the one-time migration"
                exit 1
              fi
            done
            candidate_secret_mappings="${CLOUD_RUN_SECRET_MAPPINGS}"
            if [[ -n "${DEEPSEEK_SECRET_NAME}" && ",${candidate_secret_mappings}," != *",DEEPSEEK_API_KEY="* ]]; then
              candidate_secret_mappings="${candidate_secret_mappings},DEEPSEEK_API_KEY=${DEEPSEEK_SECRET_NAME}:latest"
            fi
            env_vars="${env_vars}|LEDGER_GITHUB_OWNER=${LEDGER_GITHUB_OWNER}|LEDGER_GITHUB_REPO=${LEDGER_GITHUB_REPO}|LEDGER_GIT_BRANCH=${LEDGER_GIT_BRANCH}"
          fi
          if [[ -n "${CLOUD_RUN_EXTRA_ENV_VARS}" ]]; then
            env_vars="${env_vars}|${CLOUD_RUN_EXTRA_ENV_VARS}"
          fi

          revision_tag="candidate-${GITHUB_SHA::12}"
          candidate_image="${{ needs.build-standalone.outputs.image }}@${{ needs.build-standalone.outputs.digest }}"
          echo "previous_traffic=${previous_traffic}" >> "$GITHUB_OUTPUT"
          echo "revision_tag=${revision_tag}" >> "$GITHUB_OUTPUT"
          echo "service_existed=${service_existed}" >> "$GITHUB_OUTPUT"
          echo "legacy_migration_required=${legacy_migration_required}" >> "$GITHUB_OUTPUT"
          echo "candidate_image=${candidate_image}" >> "$GITHUB_OUTPUT"

          traffic_args=(--tag="${revision_tag}")
          if [[ "${service_existed}" == "true" ]]; then
            traffic_args+=(--no-traffic)
          fi

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${candidate_image}" \
            --service-account="${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --execution-environment=gen2 \
            --allow-unauthenticated \
            --ingress=all \
            --port=3000 \
            --cpu=1 \
            --memory=1Gi \
            --cpu-throttling \
            --concurrency=8 \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=900s \
            "${traffic_args[@]}" \
            --set-env-vars="${env_vars}" \
            --set-secrets="${candidate_secret_mappings}" \
            --quiet

      - name: Verify candidate and promote traffic
        id: verify-promote
        if: ${{ steps.freshness.outputs.proceed == 'true' && needs.plan.outputs.cloud_run == 'true' }}
        env:
          REVISION_TAG: ${{ steps.deploy-candidate.outputs.revision_tag }}
          CLOUD_RUN_SECRET_MAPPINGS: ${{ secrets.CLOUD_RUN_SECRET_MAPPINGS }}
        run: |
          candidate_url=""
          candidate_revision=""
          for attempt in {1..12}; do
            service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
            candidate_url="$(jq -r --arg tag "${REVISION_TAG}" '.status.traffic[]? | select(.tag == $tag) | .url' <<<"${service_json}")"
            candidate_revision="$(jq -r --arg tag "${REVISION_TAG}" '.status.traffic[]? | select(.tag == $tag) | .revisionName' <<<"${service_json}")"
            if [[ -n "${candidate_url}" && "${candidate_url}" != "null" && -n "${candidate_revision}" && "${candidate_revision}" != "null" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "${candidate_url}" || "${candidate_url}" == "null" || -z "${candidate_revision}" || "${candidate_revision}" == "null" ]]; then
            echo "::error::candidate revision URL was not published"
            exit 1
          fi

          health_body="$(mktemp)"
          cleanup_health_body() {
            rm -f "${health_body}"
          }
          trap cleanup_health_body EXIT

          candidate_healthy=false
          for attempt in {1..36}; do
            health_status="$(curl --silent --show-error --output "${health_body}" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "${candidate_url}/api/health" || true)"
            if [[ "${health_status}" == "200" ]]; then
              candidate_healthy=true
              break
            fi
            echo "candidate health attempt ${attempt}/36 returned HTTP ${health_status:-transport-error}"
            head -c 8192 "${health_body}" || true
            echo
            sleep 5
          done
          if [[ "${candidate_healthy}" != "true" ]]; then
            echo "::error::candidate health check did not become ready"
            gcloud run revisions describe "${candidate_revision}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='yaml(status.conditions)' || true
            exit 1
          fi
          if [[ "${{ steps.deploy-candidate.outputs.legacy_migration_required }}" == "true" ]]; then
            if [[ "$(jq -r '.configSource // empty' "${health_body}")" != "database" ]] || [[ "$(jq -r '.state // empty' "${health_body}")" == "setup_required" ]]; then
              echo "::error::existing service did not complete the one-time database runtime configuration migration"
              cat "${health_body}"
              exit 1
            fi
          fi
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "${candidate_url}/" >/dev/null

          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --to-revisions="${candidate_revision}=100" \
            --quiet

          if [[ "${{ steps.deploy-candidate.outputs.legacy_migration_required }}" == "true" ]]; then
            platform_secret_mappings="$(tr ',' '\n' <<<"${CLOUD_RUN_SECRET_MAPPINGS}" \
              | awk -F= '$1 != "APP_PASSWORD" && $1 != "LEDGER_GITHUB_TOKEN" && $1 != "LEDGER_GITHUB_INDEX_TOKEN" && $1 != "DEEPSEEK_API_KEY" && $1 != "OPENAI_API_KEY" && $1 != "BUB_TELEGRAM_TOKEN"' \
              | paste -sd, -)"
            gcloud run services update "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --remove-env-vars=LEDGER_GITHUB_OWNER,LEDGER_GITHUB_REPO,LEDGER_GIT_BRANCH \
              --set-secrets="${platform_secret_mappings}" \
              --quiet
          fi

          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          final_health="$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${service_url}/api/health")"
          if [[ "$(jq -r '.configSource // empty' <<<"${final_health}")" != "database" ]]; then
            echo "::error::Cloud Run service is not using database runtime configuration"
            exit 1
          fi
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "${service_url}/" >/dev/null
          echo "Cloud Run: ${service_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore failed promotion
        if: ${{ always() && steps.freshness.outputs.proceed == 'true' && steps.deploy-candidate.outputs.revision_tag != '' }}
        env:
          CANDIDATE_IMAGE: ${{ steps.deploy-candidate.outputs.candidate_image }}
          PREVIOUS_TRAFFIC: ${{ steps.deploy-candidate.outputs.previous_traffic }}
          REVISION_TAG: ${{ steps.deploy-candidate.outputs.revision_tag }}
          SERVICE_EXISTED: ${{ steps.deploy-candidate.outputs.service_existed }}
          PROMOTION_OUTCOME: ${{ steps.verify-promote.outcome }}
        run: |
          cleanup_failed=false
          restored_traffic=""

          if [[ "${PROMOTION_OUTCOME}" != "success" && "${SERVICE_EXISTED}" == "false" ]]; then
            existing_service="$(gcloud run services list --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --filter="metadata.name=${CLOUD_RUN_SERVICE}" --format='value(metadata.name)')"
            if [[ -z "${existing_service}" ]]; then
              :
            elif [[ "${existing_service}" == "${CLOUD_RUN_SERVICE}" ]]; then
              service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
              candidate_revision="$(jq -r --arg tag "${REVISION_TAG}" '([.status.traffic[]?, .spec.traffic[]?] | map(select(.tag == $tag and .revisionName != null) | .revisionName) | first) // empty' <<<"${service_json}")"
              if [[ -z "${candidate_revision}" || "${candidate_revision}" == "null" ]]; then
                echo "::error::cannot prove ownership of the unsuccessful first Cloud Run deployment"
                cleanup_failed=true
              else
                revision_image="$(gcloud run revisions describe "${candidate_revision}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(spec.containers[0].image)')"
                if [[ "${revision_image}" != "${CANDIDATE_IMAGE}" ]]; then
                  echo "::error::unsuccessful first deployment image does not match the candidate digest"
                  cleanup_failed=true
                elif gcloud run services delete "${CLOUD_RUN_SERVICE}" \
                  --project="${GCP_PROJECT_ID}" \
                  --region="${GCP_REGION}" \
                  --quiet; then
                  :
                else
                  echo "::error::failed to remove the unsuccessful first Cloud Run deployment"
                  cleanup_failed=true
                fi
              fi
            else
              echo "::error::Cloud Run service lookup returned an unexpected result during cleanup"
              cleanup_failed=true
            fi
          elif [[ "${PROMOTION_OUTCOME}" != "success" && -n "${PREVIOUS_TRAFFIC}" ]]; then
            if ! gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --to-revisions="${PREVIOUS_TRAFFIC}" \
              --quiet; then
              echo "::error::failed to restore previous Cloud Run traffic"
              cleanup_failed=true
            else
              if ! service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"; then
                echo "::error::failed to read Cloud Run traffic after restoration"
                cleanup_failed=true
              else
                restored_traffic="$(jq -r '[.status.traffic[]? | select((.percent // 0) > 0 and .revisionName != null) | "\(.revisionName)=\(.percent)"] | sort | join(",")' <<<"${service_json}")"
              fi
              if [[ "${cleanup_failed}" == "false" && "${restored_traffic}" != "${PREVIOUS_TRAFFIC}" ]]; then
                echo "::error::Cloud Run traffic restoration did not match the previous split"
                cleanup_failed=true
              fi
            fi
          fi

          if [[ "${cleanup_failed}" == "true" ]]; then
            exit 1
          fi

      - name: Remove candidate traffic tag
        if: ${{ always() && steps.freshness.outputs.proceed == 'true' && steps.deploy-candidate.outputs.revision_tag != '' }}
        env:
          REVISION_TAG: ${{ steps.deploy-candidate.outputs.revision_tag }}
        run: |
          existing_service="$(gcloud run services list --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --filter="metadata.name=${CLOUD_RUN_SERVICE}" --format='value(metadata.name)')"
          if [[ -z "${existing_service}" ]]; then
            exit 0
          fi
          if [[ "${existing_service}" != "${CLOUD_RUN_SERVICE}" ]]; then
            echo "::error::Cloud Run service lookup returned an unexpected result during tag cleanup"
            exit 1
          fi

          service_json="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format=json)"
          tag_revision="$(jq -r --arg tag "${REVISION_TAG}" '([.status.traffic[]?, .spec.traffic[]?] | map(select(.tag == $tag and .revisionName != null) | .revisionName) | first) // empty' <<<"${service_json}")"
          if [[ -z "${tag_revision}" || "${tag_revision}" == "null" ]]; then
            exit 0
          fi

          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --remove-tags="${REVISION_TAG}" \
            --quiet

      - name: Tag deployed Cloud Run image as latest
        if: ${{ steps.freshness.outputs.proceed == 'true' && needs.plan.outputs.cloud_run == 'true' && steps.verify-promote.outcome == 'success' }}
        run: .github/scripts/update-artifact-latest-tag.sh "${CLOUD_RUN_SERVICE}" "${{ needs.build-standalone.outputs.digest }}"
