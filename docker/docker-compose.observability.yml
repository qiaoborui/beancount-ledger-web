name: beancount-ledger-observability

services:
  prometheus:
    image: prom/prometheus:v3.6.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-9090}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.1
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "${GRAFANA_PORT:-3001}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      PROMETHEUS_URL: "http://127.0.0.1:${PROMETHEUS_PORT:-9090}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  grafana_data:
