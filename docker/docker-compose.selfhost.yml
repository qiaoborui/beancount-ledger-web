name: beancount-ledger-selfhost

x-runtime-env: &runtime-env
  DATABASE_URL: postgresql://ledger@database:5432/ledger?sslmode=disable
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}
  LEDGER_READ_MODEL: postgres
  LEDGER_READ_MODEL_STRICT: "true"
  POSTGRES_MAX_OPEN_CONNS: "${POSTGRES_MAX_OPEN_CONNS:-4}"
  POSTGRES_MAX_IDLE_CONNS: "${POSTGRES_MAX_IDLE_CONNS:-2}"
  POSTGRES_CONN_MAX_IDLE_SECONDS: "${POSTGRES_CONN_MAX_IDLE_SECONDS:-60}"
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.selfhost}
  APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env.selfhost}
  LEDGER_AUTH_DISABLED: "${LEDGER_AUTH_DISABLED:-false}"

  # Select one deployment transport. HTTP is an explicit same-origin
  # password-only compatibility mode; HTTPS is the default.
  LEDGER_AUTH_TRANSPORT: "${LEDGER_AUTH_TRANSPORT:-https}"
  PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
  WEBAUTHN_PUBLIC_ORIGIN: "${WEBAUTHN_PUBLIC_ORIGIN:-}"
  WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-}"
  LEDGER_ENABLED_MODULES: "${LEDGER_ENABLED_MODULES:-importers}"

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ghcr.io/qiaoborui/beancount-ledger-web-selfhost-server:${SELFHOST_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: selfhost-server
      args:
        LEDGER_UID: "${LEDGER_UID:-1000}"
        LEDGER_GID: "${LEDGER_GID:-1000}"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *runtime-env
      PORT: "3000"
      LEDGER_STORAGE: github_api
      LEDGER_GITHUB_OWNER: ${LEDGER_GITHUB_OWNER:?set LEDGER_GITHUB_OWNER in .env.selfhost}
      LEDGER_GITHUB_REPO: ${LEDGER_GITHUB_REPO:?set LEDGER_GITHUB_REPO in .env.selfhost}
      LEDGER_GIT_BRANCH: "${LEDGER_GIT_BRANCH:-main}"
      LEDGER_GITHUB_TOKEN: ${LEDGER_GITHUB_TOKEN:?set LEDGER_GITHUB_TOKEN in .env.selfhost}
      LEDGER_GITHUB_API_URL: "${LEDGER_GITHUB_API_URL:-}"
      LEDGER_INDEX_NOTIFY_ENABLED: "true"
    expose:
      - "3000"
    healthcheck:
      # `/api/health` intentionally remains unavailable until the indexer has
      # published a revision. The API must still be reachable for a brand-new
      # private repository to complete onboarding and create its first one.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/auth/me', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  indexer:
    image: ghcr.io/qiaoborui/beancount-ledger-web-selfhost-indexer:${SELFHOST_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: selfhost-indexer
      args:
        LEDGER_UID: "${LEDGER_UID:-1000}"
        LEDGER_GID: "${LEDGER_GID:-1000}"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      <<: *runtime-env
      LEDGER_ROOT: /data/ledger
      BEAN_CHECK_BIN: bean-check
      LEDGER_GIT_SYNC_ENABLED: "true"
      LEDGER_GIT_REMOTE_URL: ${LEDGER_GIT_REMOTE_URL:?set LEDGER_GIT_REMOTE_URL in .env.selfhost}
      LEDGER_GITHUB_INDEX_TOKEN: ${LEDGER_GITHUB_INDEX_TOKEN:?set LEDGER_GITHUB_INDEX_TOKEN in .env.selfhost}
      LEDGER_INDEX_NOTIFY_ENABLED: "true"
      LEDGER_INDEX_BEAN_CHECK_ENABLED: "true"
      LEDGER_INDEX_INTERVAL_SECONDS: "${LEDGER_INDEX_INTERVAL_SECONDS:-60}"
      LEDGER_INDEX_RETRY_INITIAL_SECONDS: "${LEDGER_INDEX_RETRY_INITIAL_SECONDS:-5}"
      LEDGER_INDEX_RETRY_MAX_SECONDS: "${LEDGER_INDEX_RETRY_MAX_SECONDS:-60}"
    volumes:
      - type: bind
        source: ${LEDGER_CHECKOUT_HOST_PATH:?set an absolute LEDGER_CHECKOUT_HOST_PATH in .env.selfhost}
        target: /data/ledger
    command: ["/app/ledger-indexer-daemon"]
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: ghcr.io/qiaoborui/beancount-ledger-web-selfhost-frontend:${SELFHOST_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: ghcr.io/qiaoborui/beancount-ledger-web-selfhost-caddy:${SELFHOST_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: caddy
    restart: unless-stopped
    depends_on:
      - server
      - frontend
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
      CADDY_TLS_DIRECTIVE: "${CADDY_TLS_DIRECTIVE:-}"
      CADDY_FRONTEND_UPSTREAM: frontend:80
    ports:
      - "${SELFHOST_HTTP_BIND_ADDRESS:-127.0.0.1}:${SELFHOST_HTTP_PORT:-8080}:80"
      - "${SELFHOST_HTTPS_BIND_ADDRESS:-127.0.0.1}:${SELFHOST_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
