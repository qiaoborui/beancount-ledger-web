name: beancount-ledger-selfhost

x-database-env: &database-env
  DATABASE_URL: postgresql://ledger@database:5432/ledger?sslmode=disable
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}
  POSTGRES_MAX_OPEN_CONNS: "${POSTGRES_MAX_OPEN_CONNS:-4}"
  POSTGRES_MAX_IDLE_CONNS: "${POSTGRES_MAX_IDLE_CONNS:-2}"
  POSTGRES_CONN_MAX_IDLE_SECONDS: "${POSTGRES_CONN_MAX_IDLE_SECONDS:-60}"

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.selfhost}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: selfhost-server
      args:
        LEDGER_UID: "${LEDGER_UID:-1000}"
        LEDGER_GID: "${LEDGER_GID:-1000}"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *database-env
      PORT: "3000"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.selfhost}
      INDEXER_IDENTITY_TOKEN: ${INDEXER_IDENTITY_TOKEN:?set INDEXER_IDENTITY_TOKEN in .env.selfhost}
      INDEXER_HEALTH_URL: http://indexer:3001/health
      AGENT_SERVICE_URL: http://agent:8080
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in .env.selfhost}
      LEDGER_AUTH_DISABLED: "${LEDGER_AUTH_DISABLED:-false}"
      LEDGER_AUTH_TRANSPORT: "${LEDGER_AUTH_TRANSPORT:-http}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      WEBAUTHN_PUBLIC_ORIGIN: "${WEBAUTHN_PUBLIC_ORIGIN:-}"
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-}"
      LEDGER_ENABLED_MODULES: "${LEDGER_ENABLED_MODULES:-importers}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: agent
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      <<: *database-env
      LEDGER_API_URL: http://server:3000
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in .env.selfhost}
      BUB_MODEL: "${BUB_MODEL:-openai:ledger-agent}"
      BUB_API_BASE: http://server:3000/api/internal/agent/model
      BUB_API_KEY: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in .env.selfhost}
      BUB_TELEGRAM_TOKEN: "${BUB_TELEGRAM_TOKEN:-}"
      BUB_TELEGRAM_ALLOW_USERS: "${BUB_TELEGRAM_ALLOW_USERS:-}"
      BUB_TELEGRAM_ALLOW_CHATS: "${BUB_TELEGRAM_ALLOW_CHATS:-}"
      BUB_TELEGRAM_MODE: "${BUB_TELEGRAM_MODE:-polling}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: selfhost-indexer
      args:
        LEDGER_UID: "${LEDGER_UID:-1000}"
        LEDGER_GID: "${LEDGER_GID:-1000}"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      <<: *database-env
      LEDGER_ROOT: /data/ledger
      INDEXER_CONFIG_URL: http://server:3000/api/indexer/config
      INDEXER_IDENTITY_TOKEN: ${INDEXER_IDENTITY_TOKEN:?set INDEXER_IDENTITY_TOKEN in .env.selfhost}
      LEDGER_INDEX_NOTIFY_ENABLED: "true"
      LEDGER_INDEX_BEAN_CHECK_ENABLED: "true"
      BEAN_CHECK_BIN: bean-check
    volumes:
      - type: bind
        source: ${LEDGER_CHECKOUT_HOST_PATH:?set an absolute LEDGER_CHECKOUT_HOST_PATH in .env.selfhost}
        target: /data/ledger
    command: ["/app/ledger-indexer-daemon"]
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        VITE_ENABLE_SPEED_INSIGHTS: "false"
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: caddy
    restart: unless-stopped
    depends_on:
      - server
      - agent
      - frontend
    environment:
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-:80}"
      CADDY_TLS_DIRECTIVE: "${CADDY_TLS_DIRECTIVE:-}"
      CADDY_FRONTEND_UPSTREAM: frontend:80
    ports:
      - "${SELFHOST_HTTP_BIND_ADDRESS:-127.0.0.1}:${SELFHOST_HTTP_PORT:-8080}:80"
      - "${SELFHOST_HTTPS_BIND_ADDRESS:-127.0.0.1}:${SELFHOST_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
