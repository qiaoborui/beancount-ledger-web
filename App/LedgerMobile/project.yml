name: LedgerMobile

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LedgerMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Ledger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: 使用 Face ID 解锁受保护的账本金额和财务数据。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoborui.ledger.mobile
        PRODUCT_NAME: LedgerMobile
        PRODUCT_MODULE_NAME: LedgerMobile
        DEVELOPMENT_TEAM: H92F889YBH
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Supporting/LedgerMobile.entitlements
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - LedgerMobileTests

  LedgerMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LedgerMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoborui.ledger.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
