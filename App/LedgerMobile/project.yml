name: LedgerMobile

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LedgerMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - target: LedgerWidgets
        embed: true
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Ledger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.qiaoborui.ledger.mobile
            CFBundleURLSchemes:
              - ledger
        NSFaceIDUsageDescription: 使用 Face ID 解锁受保护的账本金额和财务数据。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoborui.ledger.mobile
        PRODUCT_NAME: LedgerMobile
        PRODUCT_MODULE_NAME: LedgerMobile
        DEVELOPMENT_TEAM: H92F889YBH
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Supporting/LedgerMobilePersonal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERSONAL_TEAM_BUILD
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERSONAL_TEAM_BUILD
    scheme:
      testTargets:
        - LedgerMobileTests
        - LedgerMobileUITests
        - LedgerWidgetsTests

  LedgerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
      - path: Sources/LedgerWidgetSnapshot.swift
      - path: Sources/MoneyText.swift
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Ledger 小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoborui.ledger.mobile.widgets
        PRODUCT_NAME: LedgerWidgets
        PRODUCT_MODULE_NAME: LedgerWidgets
        DEVELOPMENT_TEAM: H92F889YBH
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/LedgerWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  LedgerMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LedgerMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoborui.ledger.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

  LedgerMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: LedgerMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoborui.ledger.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES

  LedgerWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WidgetTests
      - path: WidgetExtension/AccountBalanceWidget.swift
      - path: WidgetExtension/ExpenseOverviewWidget.swift
      - path: WidgetExtension/ExpenseCalendarWidget.swift
      - path: WidgetExtension/ImportStatusWidget.swift
      - path: WidgetExtension/WidgetDesign.swift
      - path: Sources/LedgerWidgetSnapshot.swift
      - path: Sources/MoneyText.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoborui.ledger.mobile.widgettests
        GENERATE_INFOPLIST_FILE: YES
